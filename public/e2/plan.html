<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OlchiPanel — Plans</title>
<!--
  UI_CORE application (C:/OlchiProjects/olchilab-business-homepage/UI_CORE.md):
  user_outcome: 사람이 한 화면에서 진행 중 업무의 상태·우선순위·담당(에이전트)을 판단한다.
  primary_capability: Operations Workspace (진행 보드 — 같은 업무 원본에서 파생, 지라 흉내 아님).
  brand_color_contract: 고정 역할 토큰만. Deep Navy/Warm Paper=기본 리듬, Teal=선택/활성·세션 링크,
    Lime=제한적 실행 신호(진행·완료), Orange=urgent 경고. 임의 accent hue 추가 0.
  composition: 읽기 순서=플랜 선택→열(상태)→카드. 카드 정보 예산=제목+우선순위+담당 뱃지.
    상태 변경=named click(드래그 전용 금지). 현재값을 추세로 표시하지 않음.
-->
<style>
:root{
  --navy:#1B3556; --teal:#17777A; --lime:#A8CF45; --paper:#F5F7F2; --graphite:#24323D; --orange:#E98A2B;
  --bg:var(--paper); --panel:#fff; --line:#dfe4dd; --fg:var(--graphite); --mut:#6b7a75;
  --sel:var(--teal); --exec:var(--lime); --warn:var(--orange);
  color-scheme:light;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12202f; --panel:#1b3556; --line:#2b4a6b; --fg:#e7edf3; --mut:#9db0c4; --sel:#3aa6a9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  color-scheme:dark;
  --bg:#12202f; --panel:#1b3556; --line:#2b4a6b; --fg:#e7edf3; --mut:#9db0c4; --sel:#3aa6a9;
}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;font:14px/1.5 system-ui,'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header .mark{width:22px;height:22px;border-radius:6px;background:var(--navy);display:inline-grid;place-items:center;flex:0 0 auto}
header .mark::after{content:'';width:0;height:0;border-left:8px solid var(--lime);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
header b{font-size:16px;letter-spacing:-.01em;color:var(--fg)}
select,input,textarea,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{resize:vertical}
button{cursor:pointer;transition:border-color .12s,background .12s}
button:hover{border-color:var(--sel)}
.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.primary:hover{background:#12595c;border-color:#12595c}
.mut{color:var(--mut);font-size:13px}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:16px;align-items:stretch;flex:1 1 auto}
.col{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;transition:border-color .12s,background .12s,box-shadow .12s}
.col.drop-target{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 8%,var(--panel));box-shadow:inset 0 0 0 1px var(--sel)}
.col h3{margin:2px 4px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;align-items:center;justify-content:space-between;gap:6px}
.col-title{min-width:0;display:flex;align-items:center}
.col-tools{display:flex;align-items:center;gap:4px;flex:none}
.col h3 .n{background:var(--bg);border-radius:20px;padding:1px 8px;font-weight:700;color:var(--fg)}
.col-collapse{width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--mut);font-size:16px;line-height:1}
.col-collapse:hover{background:var(--bg);color:var(--fg)}
.col.collapsed{padding:8px 5px;align-items:center;overflow:hidden}
.col.collapsed h3{height:100%;margin:0;flex-direction:column;justify-content:flex-start;gap:9px}
.col.collapsed .col-title{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;gap:5px}
.col.collapsed .dot{margin:0 0 4px}
.col.collapsed .col-tools{flex-direction:column-reverse}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.d-in_progress{background:var(--exec)} .d-done{background:var(--teal)} .d-backlog{background:var(--mut)} .d-todo{background:var(--navy)} .d-canceled{background:var(--line)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:grab}
.card:active{cursor:grabbing}
.card.dragging{opacity:.46;box-shadow:none}
.card:hover{border-color:var(--sel);box-shadow:0 1px 4px rgba(23,119,122,.12)}
.card.sel{border-color:var(--sel);box-shadow:0 0 0 2px rgba(23,119,122,.35)}
.card .edit{width:100%;font:inherit;font-weight:500;border:1px solid var(--sel);border-radius:5px;padding:2px 5px;background:var(--panel)}
.hint{margin-left:auto;font-size:12px;color:var(--mut)}
.hint kbd{font:inherit;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin:0 1px}
.plan-transfer{display:flex;align-items:center;gap:6px;flex:none}
.plan-transfer button{padding:5px 8px;white-space:nowrap;font-size:12.5px}
.plan-file{display:none}
.addbox{width:100%}
.addbox input{width:100%;font:inherit;border:1px solid var(--sel);border-radius:6px;padding:5px 7px;background:var(--bg)}
.card .row1{display:flex;align-items:flex-start;gap:7px}
.card .t{white-space:pre-wrap;font-weight:500;flex:1}
.card .note{margin:5px 16px 0;color:var(--mut);font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pri{flex:0 0 auto;margin-top:3px;width:9px;height:9px;border-radius:50%}
.p0{background:transparent;border:1.5px solid var(--line)} .p1{background:var(--mut)} .p2{background:var(--navy)} .p3{background:var(--teal)} .p4{background:var(--warn)}
.sess{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;color:var(--teal);background:rgba(23,119,122,.10);border-radius:6px;padding:1px 7px}
.add{width:100%;border-style:dashed;color:var(--mut);margin-top:2px;font-size:13px}
.add:hover{color:var(--teal)}
/* P3 — everything clickable for non-developers (keyboard stays for power users) */
.card .row1{position:relative}
.menu-btn{flex:0 0 auto;border:0;background:none;color:var(--mut);font-size:16px;line-height:1;padding:0 2px;border-radius:5px;opacity:0;cursor:pointer}
.card:hover .menu-btn,.card.sel .menu-btn{opacity:1}
.menu-btn:hover{background:var(--line);color:var(--fg)}
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(27,53,86,.18);padding:6px;min-width:180px;max-height:calc(100vh - 16px);overflow:auto}
.menu .grp{font-size:11px;color:var(--mut);padding:4px 6px 2px}
.menu .opt{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:13px}
.menu .opt:hover{background:var(--bg)}
.menu .opt.cur{color:var(--teal);font-weight:600}
.menu .row{display:flex;gap:4px;padding:2px 4px 4px}
.menu .prio{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:11px}
.menu .prio:hover{border-color:var(--sel)}
.menu .del{color:var(--warn)}
.lbls{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lbl{font-size:10.5px;border-radius:5px;padding:1px 6px;color:#fff}
.menu .lblopt{display:inline-flex;align-items:center;gap:5px}
.menu .lblopt .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
#err{color:var(--warn);padding:8px 18px 0;font-size:13px;min-height:0}
#err:empty{display:none}
#err.ok{color:var(--sel)}
/* embedded in the situation-board SPA tab: drop the redundant brand mark/title
   (the SPA header already provides context) and lighten the chrome. */
body.embed .mark,body.embed header b,body.embed .hint{display:none}
body.embed header{border-bottom:0;padding:10px 14px}
body.embed{height:100%;min-height:0;overflow:hidden;background:var(--bg)}
body.embed #board{min-height:0;overflow:auto;overscroll-behavior:contain}
.empty{grid-column:1/-1;align-self:start;min-width:0;padding:22px 18px;color:var(--mut);line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.composer{width:min(520px,calc(100vw - 32px));max-height:min(720px,calc(100vh - 32px));padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);box-shadow:0 24px 72px rgba(5,18,31,.34);overflow:hidden}
.composer::backdrop{background:rgba(5,18,31,.58);backdrop-filter:blur(2px)}
.composer form{display:flex;flex-direction:column;max-height:min(720px,calc(100vh - 32px))}
.composer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.composer-head h2{margin:0;font-size:19px;letter-spacing:-.02em}
.composer-head p{margin:3px 0 0;color:var(--mut);font-size:12.5px}
.icon-btn{width:34px;height:34px;padding:0;border:0;background:transparent;font-size:22px;line-height:1;color:var(--mut)}
.icon-btn:hover{background:var(--bg);color:var(--fg)}
.composer-body{display:grid;gap:15px;padding:18px 22px;overflow:auto}
.field{display:grid;gap:6px;min-width:0}
.field>span,.composer fieldset legend{font-size:12px;font-weight:700;color:var(--mut)}
.field input,.field textarea,.field select{width:100%;background:var(--bg)}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid color-mix(in srgb,var(--sel) 38%,transparent);border-color:var(--sel)}
.field textarea{min-height:112px;max-height:240px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.composer fieldset{margin:0;padding:0;border:0;min-width:0}
.composer-labels{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.composer-label{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:12px}
.composer-label:has(input:checked){border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.composer-label input{position:absolute;opacity:0;pointer-events:none}
.composer-label .sw{width:9px;height:9px;border-radius:3px}
.composer-error{min-height:20px;color:var(--warn);font-size:12px}
.composer-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.composer-actions button{min-width:76px}
body.composer-open{overflow:hidden}
.transfer-dialog{width:min(460px,calc(100vw - 32px));padding:0;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--fg);box-shadow:0 22px 60px rgba(5,18,31,.32)}
.transfer-dialog::backdrop{background:rgba(5,18,31,.52)}
.transfer-dialog form{display:grid;gap:16px;padding:20px}
.transfer-dialog h2{margin:0;font-size:18px;letter-spacing:-.015em}
.transfer-dialog p{margin:-9px 0 0;color:var(--mut);font-size:12.5px;line-height:1.5}
.transfer-modes{display:grid;gap:8px;margin:0;padding:0;border:0}
.transfer-mode{display:grid;grid-template-columns:auto 1fr;gap:1px 9px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.transfer-mode:last-child{border-bottom:0}
.transfer-mode input{grid-row:1/3;margin-top:3px}
.transfer-mode b{font-size:13px}
.transfer-mode span{color:var(--mut);font-size:12px}
.transfer-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:3px}
@media (max-width:1100px){
  body.embed #board{gap:8px;padding:12px}
  body.embed .col{padding:8px}
  body.embed .col h3{margin-inline:2px;font-size:10px;letter-spacing:.035em;gap:4px}
}
@media (max-width:760px){
  header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px}
  header .mark,header b{display:none}
  #planSel{width:100%;min-width:0}
  #newPlan{white-space:nowrap}
  #meta{grid-column:1/-1}
  .plan-transfer{grid-column:1/-1}
  .hint{display:none}
  #board{display:grid;gap:10px;padding:10px 12px 18px;overflow-x:auto;overflow-y:visible;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
  .col{width:auto;min-width:0;flex:auto;scroll-snap-align:start}
  body.embed #board{align-items:stretch}
  .menu-btn{opacity:1;min-width:30px;min-height:30px}
  .menu{max-width:calc(100vw - 48px)}
  body.embed header{padding:10px 12px}
  .composer{width:calc(100vw - 20px);max-height:calc(100vh - 20px)}
  .composer form{max-height:calc(100vh - 20px)}
  .composer-head{padding:16px 16px 12px}
  .composer-body{padding:15px 16px}
  .composer-actions{padding:12px 16px 16px}
  .field-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style></head><body>
<header>
  <span class="mark" aria-hidden="true"></span>
  <b>OlchiPanel Plans</b>
  <span title="빈 플랜 도구 정리" style="color:var(--teal);font-weight:700">⑥</span><select id="planSel" aria-label="플랜 선택"></select>
  <button id="newPlan">+ 새 플랜</button>
  <span class="mut" id="meta"></span>
  <div class="plan-transfer" aria-label="플랜 이동">
    <button id="sendPlan" type="button">세션으로</button>
    <button id="exportPlan" type="button">내보내기</button>
    <button id="importPlan" type="button">가져오기</button>
    <input class="plan-file" id="planFile" type="file" accept="application/json,.json">
  </div>
  <span class="hint"><kbd>↑↓←→</kbd> 이동 · <kbd>c</kbd> 추가 · <kbd>e</kbd>/<kbd>⏎</kbd> 편집 · <kbd>x</kbd> 상태 · <kbd>1–4</kbd> 우선순위 · <kbd>del</kbd> 삭제</span>
</header>
<div id="err" role="status"></div>
<div id="board"></div>
<dialog class="transfer-dialog" id="sessionTransfer" aria-labelledby="sessionTransferTitle">
  <form id="sessionTransferForm">
    <h2 id="sessionTransferTitle">다른 세션으로 보내기</h2>
    <p>같은 원본을 이어 쓸지, 독립된 사본을 만들지 선택하세요.</p>
    <label class="field"><span>받을 세션</span><select id="targetSession" required></select></label>
    <fieldset class="transfer-modes">
      <label class="transfer-mode"><input type="radio" name="transferMode" value="continue" checked><b>같이 이어쓰기</b><span>두 세션이 같은 플랜 원본을 함께 갱신합니다.</span></label>
      <label class="transfer-mode"><input type="radio" name="transferMode" value="copy"><b>사본 보내기</b><span>현재 상태에서 분리된 새 플랜을 만들어 연결합니다.</span></label>
    </fieldset>
    <div class="transfer-actions"><button id="sessionTransferCancel" type="button">취소</button><button class="primary" type="submit">보내기</button></div>
  </form>
</dialog>
<dialog class="composer" id="cardComposer" aria-labelledby="composerTitle">
  <form id="cardComposerForm">
    <div class="composer-head">
      <div><h2 id="composerTitle">새 카드</h2><p id="composerSubtitle">할 일을 충분히 적고 바로 보드에 추가하세요.</p></div>
      <button class="icon-btn" id="composerClose" type="button" aria-label="작성창 닫기">×</button>
    </div>
    <div class="composer-body">
      <label class="field"><span>제목</span><input id="cardTitle" maxlength="200" autocomplete="off" required placeholder="무엇을 해야 하나요?"></label>
      <label class="field"><span>설명 <small>(선택)</small></span><textarea id="cardNote" maxlength="4000" placeholder="완료 기준이나 필요한 맥락을 적으세요."></textarea></label>
      <div class="field-row">
        <label class="field"><span>상태</span><select id="cardStatus"></select></label>
        <label class="field"><span>우선순위</span><select id="cardPriority">
          <option value="0">없음</option><option value="1">낮음</option><option value="2">보통</option><option value="3">높음</option><option value="4">긴급</option>
        </select></label>
      </div>
      <fieldset><legend>라벨 <small>(선택)</small></legend><div class="composer-labels" id="composerLabels"></div></fieldset>
      <div class="composer-error" id="composerError" role="status" aria-live="polite"></div>
    </div>
    <div class="composer-actions"><button id="composerCancel" type="button">취소</button><button class="primary" id="composerSave" type="submit">추가</button></div>
  </form>
</dialog>
<script>
const STATES=['backlog','todo','in_progress','done','canceled'];
const LABEL={backlog:'Backlog',todo:'To do',in_progress:'In progress',done:'Done',canceled:'Canceled'};
const PRILABEL={0:'우선순위 없음',1:'낮음',2:'보통',3:'높음',4:'긴급'};
// preset labels only (non-devs don't manage taxonomies) — brand-derived colors
const LABELS=[
  {id:'urgent',name:'급함',color:'#E98A2B'},
  {id:'important',name:'중요',color:'#1B3556'},
  {id:'idea',name:'아이디어',color:'#6f8f2a'},
  {id:'review',name:'검토',color:'#17777A'},
  {id:'hold',name:'대기',color:'#6b7a75'},
];
const LBL=Object.fromEntries(LABELS.map(l=>[l.id,l]));
let plan=null, menuEl=null, dragId=null, suppressClickUntil=0;
let collapsedStates=new Set(['backlog','canceled']);
let composerItem=null, composerTrigger=null, composerSaving=false;
let activeSessionId=null, contextPlanId=null, planLoadVersion=0;
const embedded=window.top!==window.self;
const narrowBoard=window.matchMedia('(max-width:760px)');
const $=(s)=>document.querySelector(s);
function applyPanelTheme(theme){
  if(theme==='light'||theme==='dark') document.documentElement.setAttribute('data-theme',theme);
}
try{
  if(window.top!==window.self){
    document.body.classList.add('embed');
    applyPanelTheme(window.parent.document.documentElement.getAttribute('data-theme'));
  }
}catch(e){ document.body.classList.add('embed'); }
window.addEventListener('message',(e)=>{
  if(e.source!==window.parent||e.origin!==window.location.origin)return;
  if(e.data&&e.data.type==='olchipanel-theme')applyPanelTheme(e.data.theme);
  if(e.data&&e.data.type==='olchipanel-session'){
    const session=e.data.session||null, linkedPlan=e.data.planId||null;
    if(session!==activeSessionId||linkedPlan!==contextPlanId){
      activeSessionId=session;contextPlanId=linkedPlan;planLoadVersion++;
      closeCardComposer();closeMenu();$('#sessionTransfer').close();
      clearPlan();loadPlans(linkedPlan).catch(()=>{});
    }
  }
});
function showErr(m,ok){const box=$('#err');box.textContent=m||'';box.classList.toggle('ok',!!m&&!!ok);}
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){showErr((j&&j.error)||('HTTP '+r.status));throw new Error(j.error||r.status);}
  showErr(''); return j;
}
function clearPlan(){
  plan=null;selId=null;dragId=null;
  $('#planSel').innerHTML='';$('#meta').textContent='';
  render();
  $('#newPlan').disabled=embedded&&!activeSessionId;
  $('#importPlan').disabled=embedded&&!activeSessionId;
}
async function loadPlans(sel){
  const version=++planLoadVersion, session=activeSessionId;
  if(embedded&&!session){clearPlan();return;}
  const plans=await api('GET','/api/plans'+(embedded?'?session='+encodeURIComponent(session):''));
  if(version!==planLoadVersion)return;
  const s=$('#planSel'); s.innerHTML='';
  for(const p of plans){const o=document.createElement('option');o.value=p.id;o.textContent=p.title;s.appendChild(o);}
  $('#newPlan').disabled=false;$('#importPlan').disabled=false;
  if(plans.length){s.value=plans.some(p=>p.id===sel)?sel:plans[0].id;await loadPlan(s.value,false,version);}
  else clearPlan();
}
let selId=null;      // selected item id (keyboard focus)
let editing=false;   // inline edit/add in progress → suspend keyboard + live refresh
async function loadPlan(id,revealSelection,version=++planLoadVersion){
  if(embedded&&(!activeSessionId||!Array.from($('#planSel').options).some(o=>o.value===id)))return;
  const loaded=await api('GET','/api/plan?id='+encodeURIComponent(id));
  if(version!==planLoadVersion)return;
  plan=loaded;render(!!revealSelection);
}
// column→ordered items, for keyboard geometry
function byCol(){ const m={}; for(const st of STATES) m[st]=(plan?.items||[]).filter(i=>i.status===st).sort((a,b)=>(a.order||0)-(b.order||0)); return m; }
function selItem(){ return plan? plan.items.find(i=>i.id===selId) : null; }
function saveCollapsedStates(){try{localStorage.setItem('olchipanel.plan.collapsed',JSON.stringify([...collapsedStates]));}catch(e){}}
try{const saved=localStorage.getItem('olchipanel.plan.collapsed');if(saved!==null)collapsedStates=new Set(JSON.parse(saved).filter(st=>STATES.includes(st)));}catch(e){}
function toggleColumn(status){if(collapsedStates.has(status))collapsedStates.delete(status);else collapsedStates.add(status);saveCollapsedStates();render();}
function render(revealSelection){
  closeMenu();
  $('#planSel').hidden=!plan;$('#exportPlan').disabled=!plan;$('#sendPlan').disabled=!plan;
  $('#meta').textContent=plan?plan.items.length+' items · v'+plan.version:'빈 플랜';
  const shownStates=STATES;
  const cols=byCol();
  if(!selItem()){ const first=shownStates.map(s=>cols[s][0]).find(Boolean); selId=first?first.id:null; }
  const board=$('#board'); board.innerHTML='';
  board.style.gridTemplateColumns=STATES.map(st=>collapsedStates.has(st)?'46px':(narrowBoard.matches?'minmax(190px,1fr)':'minmax(0,1fr)')).join(' ');
  for(const st of shownStates){
    const items=cols[st];
    const collapsed=collapsedStates.has(st);
    const col=document.createElement('div'); col.className='col'+(collapsed?' collapsed':''); col.dataset.st=st;
    wireDropTarget(col,st);
    const head=document.createElement('h3');
    const title=document.createElement('span');title.className='col-title';title.innerHTML='<span class="dot d-'+st+'"></span>'+LABEL[st];
    const tools=document.createElement('span');tools.className='col-tools';
    const count=document.createElement('span');count.className='n';count.textContent=items.length;
    const collapse=document.createElement('button');collapse.className='col-collapse';collapse.type='button';collapse.textContent=collapsed?'›':'‹';
    collapse.title=(collapsed?'펼치기: ':'접기: ')+LABEL[st];collapse.setAttribute('aria-label',collapse.title);collapse.setAttribute('aria-expanded',String(!collapsed));
    collapse.onclick=(e)=>{e.stopPropagation();toggleColumn(st);};tools.appendChild(count);tools.appendChild(collapse);head.appendChild(title);head.appendChild(tools);col.appendChild(head);
    if(collapsed){board.appendChild(col);continue;}
    for(const it of items){
      const c=document.createElement('div'); c.className='card'+(it.id===selId?' sel':''); c.dataset.id=it.id; c.draggable=true;
      c.title='드래그 = 상태 이동 · 클릭 = 다음 상태 · 더블클릭 = 제목 편집 · ⋯ = 메뉴';
      const r1=document.createElement('div'); r1.className='row1';
      const pr=document.createElement('span'); pr.className='pri p'+(it.priority||0); pr.title=PRILABEL[it.priority||0];
      const t=document.createElement('span'); t.className='t'; t.textContent=it.title;
      const mb=document.createElement('button'); mb.className='menu-btn'; mb.textContent='⋯'; mb.title='메뉴 (상태·우선순위·라벨·삭제)';
      mb.onclick=(e)=>{ e.stopPropagation(); selId=it.id; openMenu(it,c); };
      r1.appendChild(pr); r1.appendChild(t); r1.appendChild(mb); c.appendChild(r1);
      if(it.note){const n=document.createElement('div');n.className='note';n.textContent=it.note;c.appendChild(n);}
      const labels=(it.labels||[]).filter(id=>LBL[id]);
      if(labels.length){ const lw=document.createElement('div'); lw.className='lbls';
        for(const id of labels){ const s=document.createElement('span'); s.className='lbl'; s.style.background=LBL[id].color; s.textContent=LBL[id].name; lw.appendChild(s);} c.appendChild(lw); }
      if(it.session){const b=document.createElement('span');b.className='sess';b.textContent='▣ '+it.session;c.appendChild(b);}
      c.ondragstart=(e)=>startCardDrag(e,it,c);
      c.ondragend=finishCardDrag;
      c.onclick=()=>{ if(Date.now()<suppressClickUntil)return; selId=it.id; advance(it); };
      c.ondblclick=(e)=>{ e.stopPropagation(); selId=it.id; startEdit(); };
      col.appendChild(c);
    }
    if(plan){
    const add=document.createElement('button'); add.className='add'; add.textContent='+ 추가';
    add.onclick=(e)=>{e.stopPropagation();openCardComposer(st,null,add);}; col.appendChild(add);
    }
    board.appendChild(col);
  }
  const sel=board.querySelector('.card.sel'); if(revealSelection&&sel) sel.scrollIntoView({block:'nearest',inline:'nearest'});
}
narrowBoard.addEventListener('change',()=>render());
function clearDropTargets(){ document.querySelectorAll('.col.drop-target').forEach(c=>c.classList.remove('drop-target')); }
function startCardDrag(e,it,card){
  if(editing||(e.target.closest&&e.target.closest('button,input'))){e.preventDefault();return;}
  dragId=it.id; selId=it.id; closeMenu(); card.classList.add('dragging');
  if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',it.id);}
}
function finishCardDrag(){
  document.querySelectorAll('.card.dragging').forEach(c=>c.classList.remove('dragging'));
  clearDropTargets(); dragId=null; suppressClickUntil=Date.now()+250;
}
function wireDropTarget(col,status){
  col.ondragover=(e)=>{
    if(!dragId)return;
    e.preventDefault(); if(e.dataTransfer)e.dataTransfer.dropEffect='move';
    clearDropTargets(); col.classList.add('drop-target');
  };
  col.ondragleave=(e)=>{ if(!col.contains(e.relatedTarget))col.classList.remove('drop-target'); };
  col.ondrop=(e)=>{
    if(!dragId)return;
    e.preventDefault(); const id=dragId; const it=plan&&plan.items.find(item=>item.id===id);
    dragId=null; suppressClickUntil=Date.now()+250; clearDropTargets();
    if(it&&it.status!==status){selId=id;setStatusTo(it,status);}
  };
}
function closeMenu(){ if(menuEl){menuEl.remove();menuEl=null;} }
// click-driven card menu: every action reachable without the keyboard
function openMenu(it,card){
  closeMenu(); const m=document.createElement('div'); m.className='menu'; menuEl=m;
  m.onclick=(e)=>e.stopPropagation();
  const mk=(html)=>{const d=document.createElement('div');d.innerHTML=html;return d.firstChild;};
  const edit=document.createElement('button'); edit.className='opt'; edit.textContent='✎ 카드 편집';
  edit.onclick=()=>{ closeMenu(); openCardComposer(it.status,it,card); }; m.appendChild(edit);
  m.appendChild(mk('<div class="grp">상태로 이동</div>'));
  for(const st of STATES){ const o=document.createElement('button'); o.className='opt'+(it.status===st?' cur':'');
    o.innerHTML='<span class="dot d-'+st+'"></span>'+LABEL[st]; o.onclick=()=>{ closeMenu(); setStatusTo(it,st); }; m.appendChild(o); }
  m.appendChild(mk('<div class="grp">우선순위</div>'));
  const prow=document.createElement('div'); prow.className='row';
  for(let p=0;p<=4;p++){ const b=document.createElement('button'); b.className='prio'; b.title=PRILABEL[p]; b.textContent=p===0?'—':p;
    if((it.priority||0)===p) b.style.borderColor='var(--sel)'; b.onclick=()=>{ closeMenu(); setPriority(p); }; prow.appendChild(b);} m.appendChild(prow);
  m.appendChild(mk('<div class="grp">라벨 (눌러서 켜기/끄기)</div>'));
  for(const l of LABELS){ const has=(it.labels||[]).includes(l.id);
    const o=document.createElement('button'); o.className='opt'+(has?' cur':'');
    o.innerHTML='<span class="lblopt"><span class="sw" style="background:'+l.color+'"></span>'+l.name+(has?' ✓':'')+'</span>';
    o.onclick=()=>{ closeMenu(); toggleLabel(it,l.id); }; m.appendChild(o); }
  const del=document.createElement('button'); del.className='opt del'; del.textContent='🗑 삭제';
  del.onclick=()=>{ closeMenu(); delSel(); }; m.appendChild(del);
  document.body.appendChild(m);
  const r=card.getBoundingClientRect();const gap=6;const width=m.offsetWidth;const height=m.offsetHeight;
  let left=Math.min(window.innerWidth-width-gap,Math.max(gap,r.right-width));
  let top=r.bottom+gap;if(top+height>window.innerHeight-gap)top=Math.max(gap,r.top-height-gap);
  m.style.left=Math.max(gap,left)+'px';m.style.top=Math.max(gap,top)+'px';
}
function setStatusTo(it,st){ if(it.status===st)return; return mutate(()=>api('PATCH','/api/plan/item?plan='+plan.id+'&id='+it.id,{baseVersion:plan.version,patch:{status:st}})); }
function toggleLabel(it,id){ const cur=(it.labels||[]).slice(); const i=cur.indexOf(id); if(i>=0)cur.splice(i,1); else cur.push(id);
  return mutate(()=>api('PATCH','/api/plan/item?plan='+plan.id+'&id='+it.id,{baseVersion:plan.version,patch:{labels:cur}})); }
document.addEventListener('click',()=>closeMenu());
async function mutate(op){ if(editing||!plan)return; const id=plan.id,session=activeSessionId;try{await op();}catch(e){} if(session===activeSessionId&&plan&&plan.id===id)await loadPlan(id,true); }
function advance(it){ const n=STATES[(STATES.indexOf(it.status)+1)%STATES.length];
  return mutate(()=>api('PATCH','/api/plan/item?plan='+plan.id+'&id='+it.id,{baseVersion:plan.version,patch:{status:n}})); }
function setStatusRel(dir){ const it=selItem(); if(!it)return; let i=STATES.indexOf(it.status)+dir; i=(i+STATES.length)%STATES.length;
  return mutate(()=>api('PATCH','/api/plan/item?plan='+plan.id+'&id='+it.id,{baseVersion:plan.version,patch:{status:STATES[i]}})); }
function setPriority(p){ const it=selItem(); if(!it)return;
  return mutate(()=>api('PATCH','/api/plan/item?plan='+plan.id+'&id='+it.id,{baseVersion:plan.version,patch:{priority:p}})); }
function delSel(){ const it=selItem(); if(!it)return; if(!confirm('삭제: "'+it.title+'" ?'))return;
  return mutate(()=>api('DELETE','/api/plan/item?plan='+plan.id+'&id='+it.id,{baseVersion:plan.version})); }
// keyboard geometry: move selection within/between columns
function move(dr,dc){
  const cols=byCol(); const cur=selItem(); if(!cur){ const f=STATES.map(s=>cols[s][0]).find(Boolean); if(f)selId=f.id; render(true); return; }
  let ci=STATES.indexOf(cur.status); let ri=cols[cur.status].findIndex(i=>i.id===cur.id);
  if(dc){ // move to nearest non-empty column in direction dc, same-ish row
    for(let k=1;k<STATES.length;k++){ const nc=ci+dc*k; if(nc<0||nc>=STATES.length)break; const list=cols[STATES[nc]]; if(list.length){ selId=list[Math.min(ri,list.length-1)].id; break; } }
  } else if(dr){ const list=cols[cur.status]; const nr=ri+dr; if(nr>=0&&nr<list.length) selId=list[nr].id; }
  render(true);
}
function selectedComposerLabels(){return [...document.querySelectorAll('#composerLabels input:checked')].map(input=>input.value);}
function openCardComposer(status,item,trigger){
  if(editing||!plan)return; closeMenu(); editing=true; composerItem=item||null; composerTrigger=trigger||document.activeElement;
  $('#composerTitle').textContent=item?'카드 편집':'새 카드';
  $('#composerSubtitle').textContent=item?'내용과 상태를 한곳에서 수정하세요.':LABEL[status]+'에 추가합니다.';
  $('#composerSave').textContent=item?'저장':'추가'; $('#composerError').textContent='';
  $('#cardTitle').value=item?item.title:''; $('#cardNote').value=item?(item.note||''):'';
  $('#cardStatus').value=item?item.status:status; $('#cardPriority').value=String(item?(item.priority||0):0);
  const selected=new Set(item?(item.labels||[]):[]); const labels=$('#composerLabels'); labels.innerHTML='';
  for(const l of LABELS){const lab=document.createElement('label');lab.className='composer-label';
    lab.innerHTML='<input type="checkbox" value="'+l.id+'"'+(selected.has(l.id)?' checked':'')+'><span class="sw" style="background:'+l.color+'"></span>'+l.name;labels.appendChild(lab);}
  document.body.classList.add('composer-open'); $('#cardComposer').showModal();
  requestAnimationFrame(()=>{$('#cardTitle').focus();if(item)$('#cardTitle').select();});
}
function closeCardComposer(){if($('#cardComposer').open)$('#cardComposer').close();}
function startEdit(){const it=selItem();if(!it||editing)return;openCardComposer(it.status,it,document.querySelector('.card[data-id="'+it.id+'"]'));}
$('#cardStatus').innerHTML=STATES.map(st=>'<option value="'+st+'">'+LABEL[st]+'</option>').join('');
$('#composerClose').onclick=closeCardComposer; $('#composerCancel').onclick=closeCardComposer;
$('#cardComposer').addEventListener('close',()=>{editing=false;composerSaving=false;document.body.classList.remove('composer-open');
  const target=composerTrigger;composerTrigger=null;if(target&&target.isConnected)requestAnimationFrame(()=>target.focus());});
$('#cardComposerForm').onsubmit=async(e)=>{
  e.preventDefault();if(composerSaving)return;const title=$('#cardTitle').value.trim();if(!title){$('#cardTitle').reportValidity();return;}
  composerSaving=true;$('#composerSave').disabled=true;$('#composerError').textContent='';
  const payload={title,note:$('#cardNote').value.trim(),status:$('#cardStatus').value,priority:Number($('#cardPriority').value),labels:selectedComposerLabels()};
  try{
    if(composerItem){const id=composerItem.id;await api('PATCH','/api/plan/item?plan='+plan.id+'&id='+id,{baseVersion:plan.version,patch:payload});selId=id;}
    else{const r=await api('POST','/api/plan/item?plan='+plan.id,{...payload,baseVersion:plan.version});selId=r.item.id;}
    closeCardComposer();await loadPlan(plan.id,true);const card=document.querySelector('.card[data-id="'+selId+'"]');if(card){card.tabIndex=0;card.focus({preventScroll:true});}
  }catch(err){$('#composerError').textContent='저장하지 못했습니다. 다시 확인해 주세요.';}
  finally{composerSaving=false;$('#composerSave').disabled=false;}
};
// global keyboard (Linear-style). Suspended while editing an input.
document.addEventListener('keydown',(e)=>{
  if(editing||!plan) return;
  if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k=e.key;
  if(k==='ArrowUp'||k==='k'){ e.preventDefault(); move(-1,0); }
  else if(k==='ArrowDown'||k==='j'){ e.preventDefault(); move(1,0); }
  else if(k==='ArrowLeft'||k==='h'){ e.preventDefault(); move(0,-1); }
  else if(k==='ArrowRight'||k==='l'){ e.preventDefault(); move(0,1); }
  else if(k==='c'){ e.preventDefault(); const it=selItem(); const st=it?it.status:'todo'; openCardComposer(st,null,document.querySelector('.col[data-st="'+st+'"] .add')); }
  else if(k==='e'||k==='Enter'){ e.preventDefault(); startEdit(); }
  else if(k==='x'){ e.preventDefault(); const it=selItem(); if(it)advance(it); }
  else if(k==='X'){ e.preventDefault(); setStatusRel(-1); }
  else if(k>='0'&&k<='4'){ e.preventDefault(); setPriority(Number(k)); }
  else if(k==='Delete'||k==='Backspace'){ e.preventDefault(); delSel(); }
  else if(k==='Escape'){ selId=null; render(); }
});
$('#planSel').onchange=(e)=>{ selId=null; loadPlan(e.target.value); };
$('#newPlan').onclick=async()=>{
  const session=activeSessionId;
  if(embedded&&!session)return;
  const title=prompt('플랜 이름?');if(!title)return;
  const r=await api('POST','/api/plans',{title,session});
  if(session!==activeSessionId)return;
  selId=null;await loadPlans(r.id);
};
function safeFilePart(value){return String(value||'plan').trim().replace(/[<>:"/\\|?*\x00-\x1f]/g,'-').replace(/\s+/g,'-').slice(0,80)||'plan';}
function downloadJson(value,name){
  const blob=new Blob([JSON.stringify(value,null,2)+'\n'],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);
}
function humanSessionName(session){return session.name||session.goal||session.agent||session.id;}
$('#exportPlan').onclick=async()=>{
  if(!plan){showErr('내보낼 플랜을 먼저 선택하세요.');return;}
  try{
    const bundle=await api('GET','/api/plan/export?id='+encodeURIComponent(plan.id));
    downloadJson(bundle,'olchipanel-plan-'+safeFilePart(plan.title)+'-'+new Date().toISOString().slice(0,10)+'.json');
    showErr('플랜 파일을 저장했습니다.',true);
  }catch(e){}
};
$('#importPlan').onclick=()=>{const input=$('#planFile');input.value='';input.click();};
$('#planFile').onchange=async(e)=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  if(file.size>262144){showErr('파일이 너무 큽니다. 256KB 이하의 OlchiPanel 플랜 파일을 선택하세요.');return;}
  const importSession=activeSessionId;
  if(embedded&&!importSession)return;
  try{
    const bundle=JSON.parse(await file.text());
    const result=await api('POST','/api/plan/import',{bundle,session:importSession});
    if(importSession!==activeSessionId)return;
    selId=null;await loadPlans(result.id);
    showErr('가져옴: '+result.title+' · '+result.items+'개 작업'+(result.attached?' · 현재 세션에 연결':''),true);
  }catch(error){showErr('가져오지 못했습니다. OlchiPanel 플랜 파일인지 확인하세요.');}
};
async function openSessionTransfer(){
  if(!plan){showErr('보낼 플랜을 먼저 선택하세요.');return;}
  try{
    const state=await api('GET','/api/state');const sessions=state.sessions||[];
    if(!sessions.length){showErr('받을 세션이 없습니다. 먼저 에이전트 세션을 연결하세요.');return;}
    const target=$('#targetSession');target.innerHTML='';
    for(const session of sessions){const option=document.createElement('option');option.value=session.id;
      option.textContent=humanSessionName(session)+' · '+session.agent;target.appendChild(option);}
    if(activeSessionId&&sessions.some(session=>session.id===activeSessionId))target.value=activeSessionId;
    $('#sessionTransfer').showModal();
  }catch(e){}
}
$('#sendPlan').onclick=openSessionTransfer;
$('#sessionTransferCancel').onclick=()=>$('#sessionTransfer').close();
$('#sessionTransferForm').onsubmit=async(e)=>{
  e.preventDefault();const session=$('#targetSession').value;
  const mode=document.querySelector('input[name="transferMode"]:checked').value;
  try{
    const result=await api('POST','/api/plan/session',{plan:plan.id,session,mode});
    $('#sessionTransfer').close();
    if(session===activeSessionId&&mode==='copy'){selId=null;await loadPlans(result.id);}
    showErr(mode==='copy'?'독립 사본을 선택한 세션에 연결했습니다.':'같은 플랜을 선택한 세션에서 이어 쓰도록 연결했습니다.',true);
  }catch(error){}
};
// suspend live refresh while editing OR a card menu is open, so neither the
// inline editor nor an open menu is yanked out from under the user.
function busy(){ return editing || !!menuEl || !!dragId; }
function refreshPlan(){if(!busy())loadPlans(plan&&plan.id).catch(()=>{});}
try{ new EventSource('/events').onmessage=refreshPlan; }catch(e){}
setInterval(refreshPlan,5000);
loadPlans();
</script></body></html>
